name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install ruff pytest httpx
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  build-image:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t shrtn:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name shrtn shrtn:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8000/healthz
